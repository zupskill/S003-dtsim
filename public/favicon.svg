  <line x1="45" y1="155" x2="100" y2="105" stroke="#000" stroke-width="8" stroke-linecap="round"/>
  <line x1="58" y1="205" x2="110" y2="160" stroke="#000" stroke-width="8" stroke-linecap="round"/>
  <line x1="112" y1="208" x2="165" y2="162" stroke="#000" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Left Wing -->
